name = "neocinema-worker"
# Wraps .open-next/worker.js: edge-caches /api GETs and strips cache headers from errors.
main = "custom-worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
minify = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability.logs]
enabled = true
invocation_logs = true
