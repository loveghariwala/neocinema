name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Next.js with OpenNext
        run: npx opennextjs-cloudflare build
        env:
          # Needed at build time: static pages are prerendered from TMDB data.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          KINOCHECK_API_KEY: ${{ secrets.KINOCHECK_API_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: frontend
          # Uploaded as Worker secrets so ISR/API routes can read them at runtime.
          secrets: |
            TMDB_API_KEY
            WATCHMODE_API_KEY
            KINOCHECK_API_KEY
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          KINOCHECK_API_KEY: ${{ secrets.KINOCHECK_API_KEY }}
